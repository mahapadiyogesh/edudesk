async function exp(t){const r=repData(),head=['Student','Branch','Batch','Present','Absent','Leave','%'],body=r.rows.map(x=>[x.s.name,bn(x.s.branch),btn(x.s.batch),x.P,x.A,x.L,x.pct+'%']),name=`attendance_${S.rp.toLowerCase()}_${r.a}`;let blob,fn;

else{if(!window.XLSX)throw 0;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...body]),'Students');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Branch','Batch','Students','P','A','L','%'],...r.grp]),'Batch summary');const ds=dates(r);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Student','Branch','Batch',...ds],...r.rows.map(x=>[x.s.name,bn(x.s.branch),btn(x.s.batch),...ds.map(k=>db.att[k+'|'+x.s.id]||'')])]),'Date-wise');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Date','Student','Topic taught'],...Object.keys(db.notes).filter(k=>{const p=k.split('|');return p[0]>=r.a&&p[0]<=r.b&&r.rows.some(x=>x.s.id==p[1])}).sort().map(k=>[k.split('|')[0],sn(k.split('|')[1]),db.notes[k]])]),'Topics');blob=new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'});fn=name+'.xlsx'}}catch(e){return toast('Export library did not load – check internet')}

function xlsxBlob(a){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Students');return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'})}
function expStu(){if(!window.XLSX)return toast('Excel library did not load');saveBlob(xlsxBlob([['Name','Phone','Branch','Batch','Status'],...myS().map(s=>[s.name,s.phone,bn(s.branch),btn(s.batch),s.status])]),'students_'+today()+'.xlsx')}
function tpl(){if(!window.XLSX)return toast('Excel library did not load');const b=myB()[0],t=db.batches.find(x=>b&&x.branch==b.id);saveBlob(xlsxBlob([['Name','Phone','Branch','Batch','Status'],['Sample Student','9820012345',b?b.name:'Ghatkopar',t?t.name:'Morning 8–10','Active']]),'student_import_template.xlsx')}
function impForm(){modal(`<h2>Import students</h2><p style="color:var(--mu)">Upload an Excel (.xlsx) or CSV file with columns <b>Name, Phone, Branch, Batch, Status</b>. Only <b>Name</b> and <b>Branch</b> are required; Phone, Batch and Status can be blank. Missing batches are created automatically. Same name + phone is skipped.</p><button class="btn s sm" onclick="tpl()">⬇ Download template</button><label style="margin-top:12px">Choose file</label><input id="imf" type="file" accept=".xlsx,.xls,.csv" onchange="doImp(this.files[0])"><div id="imr"></div><div class="row"><button class="btn s" onclick="closeM()">Close</button></div>`)}
function doImp(f){if(!f)return;if(!window.XLSX)return toast('Excel library did not load');const r=new FileReader();r.onerror=()=>toast('Could not read file');r.onload=e=>{let rows;try{const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false})}catch(x){return $('imr').innerHTML='<p style="color:var(--bad)">This file could not be read.</p>'}
if(!rows.length)return $('imr').innerHTML='<p style="color:var(--bad)">The file has no rows.</p>';
let add=0,dup=0,bad=[];const g=(o,k)=>{const key=Object.keys(o).find(x=>x.trim().toLowerCase()==k);return key?String(o[key]).trim():''};
rows.forEach((o,i)=>{const n=g(o,'name'),ph=g(o,'phone').replace(/\D/g,'').slice(-10),bnm=g(o,'branch'),btm=g(o,'batch'),st=g(o,'status'),L='Row '+(i+2)+': ';
if(!n)return bad.push(L+'name missing');
if(db.students.some(s=>s.name.toLowerCase()==n.toLowerCase()&&s.phone==ph))return dup++;
let br=db.branches.find(x=>x.name.toLowerCase()==bnm.toLowerCase());if(!br&&!bnm&&U.branch!='All')br=db.branches.find(x=>x.id==U.branch);if(!br&&bnm&&adm()){br={id:'b'+uid(),name:bnm};db.branches.push(br)}
if(!br)return bad.push(L+'branch "'+bnm+'" not found');if(U.branch!='All'&&br.id!=U.branch)return bad.push(L+'not your branch');
let bt=btm?db.batches.find(x=>x.branch==br.id&&x.name.toLowerCase()==btm.toLowerCase()):null;if(btm&&!bt){bt={id:'t'+uid(),name:btm,branch:br.id,course:''};db.batches.push(bt)}
db.students.push({id:'s'+uid(),name:n,phone:ph,branch:br.id,batch:bt?bt.id:'',status:['Active','Completed','Dropped'].find(x=>x.toLowerCase()==st.toLowerCase())||'Active'});add++});
save();re();$('imr').innerHTML=`<p><b style="color:var(--ok)">${add} added</b> · ${dup} duplicates skipped · ${bad.length} rows skipped</p>${bad.slice(0,8).map(x=>'<div style="color:var(--bad);font-size:12px">'+esc(x)+'</div>').join('')}${bad.length>8?'<div style="font-size:12px;color:var(--mu)">…and '+(bad.length-8)+' more</div>':''}`};r.readAsArrayBuffer(f)}
function backup(){saveBlob(new Blob([JSON.stringify(db)],{type:'application/json'}),'edudesk_backup_'+today()+'.json')}
function restoreForm(){modal(`<h2>Restore backup</h2><p style="color:var(--mu)">This replaces ALL current data with the backup file (.json). You will be signed out afterwards.</p><input type="file" accept=".json" onchange="doRestore(this.files[0])"><div class="row"><button class="btn s" onclick="closeM()">Cancel</button></div>`)}
function doRestore(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const o=JSON.parse(e.target.result);if(!['branches','courses','batches','students','exams','users'].every(k=>Array.isArray(o[k]))||typeof o.att!='object'||typeof o.certs!='object'||!o.users.some(u=>u.role=='admin'))throw 0;o.notes=o.notes||{};o.rec=o.rec||db.rec;db=o;save();closeM();U=null;login();toast('Backup restored – sign in again')}catch(x){toast('This is not a valid backup file')}};r.readAsText(f)}
/* ---------- NOTES, DATE-WISE, RECOVERY ---------- */
function setNote(id,v){const k=S.ad+'|'+id;v=v.trim();if(v)db.notes[k]=v;else delete db.notes[k];save()}
function topicAll(){const t=$('topic').value.trim();if(!t)return toast('Type the topic first');attList().filter(s=>s.status!='Dropped').forEach(s=>db.notes[S.ad+'|'+s.id]=t);save();re();toast('Topic added for all')}
function saveAtt(){document.querySelectorAll('.nt').forEach(i=>setNote(i.dataset.id,i.value));const c=cnt(S.ad,attList().filter(s=>s.status!='Dropped'));save();toast('Saved: '+c.P+' present, '+c.A+' absent, '+c.L+' leave'+(c.N?', '+c.N+' not marked':''))}
function dates(r){const ds=[];for(let d=r.a;d<=r.b;d=addD(d,1))ds.push(d);return ds}
function dwTable(r){const ds=dates(r);if(!r.rows.length)return'<div class="empty">No students</div>';const col={P:'var(--ok)',A:'var(--bad)',L:'var(--warn)'};return`<table><tr><th>Student</th>${ds.map(d=>`<th title="${d}">${d.slice(8)}</th>`).join('')}</tr>${r.rows.map(x=>`<tr><td>${esc(x.s.name)}</td>${ds.map(d=>{const m=db.att[d+'|'+x.s.id]||'';return`<td style="text-align:center;font-weight:700;color:${col[m]||'var(--mu)'}">${m||'·'}</td>`}).join('')}</tr>`).join('')}</table><p style="font-size:12px;color:var(--mu);margin:8px 0 0">Column = day of month. · = not marked.</p>`}
function setRecEmail(){const e=$('rem').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email');db.rec.email=e;save();toast('Recovery email saved')}
function regenKey(){db.rec.key='EDU-'+uid().toUpperCase()+'-'+uid().toUpperCase();save();re();toast('New recovery key created')}
function forgot(){modal(`<h2>Reset admin password</h2><p style="color:var(--mu)">Enter the recovery email and the recovery key saved in Setup → Password recovery.</p><label>Recovery email</label><input id="fe" type="email" autocomplete="off"><label>Recovery key</label><input id="fk" autocomplete="off"><label>New password (min 6)</label><input id="fp1" type="password"><label>Confirm new password</label><input id="fp2" type="password"><div class="row"><button class="btn s" onclick="closeM()">Cancel</button><button class="btn" onclick="doReset()">Reset password</button></div>`)}
function doReset(){const a=db.users.find(u=>u.u=='admin')||db.users.find(u=>u.role=='admin');if($('fe').value.trim().toLowerCase()!=db.rec.email.toLowerCase()||$('fk').value.trim().toUpperCase()!=db.rec.key)return toast('Email or recovery key is wrong');const p=$('fp1').value;if(p.length<6)return toast('Password needs 6+ characters');if(p!=$('fp2').value)return toast('Passwords do not match');a.p=p;save();closeM();toast('Password changed – sign in now')}
/* ---------- CLOUD (Supabase) + DOWNLOAD FALLBACK ---------- */
async function dlSave(fn,blob){if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl)return dl.save({filename:fn,data:blob})}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
const SBH=()=>SB_KEY.startsWith('sb_')?{apikey:SB_KEY,'Content-Type':'application/json'}:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
function push(){if(!SB_URL||!synced)return;clearTimeout(pt);pt=setTimeout(async()=>{try{const r=await fetch(SB_URL+'/rest/v1/app_state',{method:'POST',headers:{...SBH(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:1,data:db,updated_at:new Date().toISOString()})});if(!r.ok)throw 0}catch(e){toast('Cloud save failed \u2013 check internet')}},700)}
async function pull(){if(!SB_URL)return;try{const r=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data',{headers:SBH()});if(!r.ok)throw 0;const j=await r.json();if(j.length&&j[0].data&&j[0].data.students){const o=j[0].data;o.notes=o.notes||{};o.rec=o.rec||db.rec;db=o;try{localStorage.setItem('edudesk1',JSON.stringify(db))}catch(e){}}synced=true;if(!j.length)push();if(U)render();toast('Connected to cloud')}catch(e){toast('Cloud not reachable \u2013 using local data')}}
login();pull();
</script></body></html>
